<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#16263f" stroke-width="2"/>

  <!-- Badminton Racket -->
  <g transform="rotate(-30 32 32)">
    <!-- Racket Head Rim -->
    <ellipse cx="32" cy="18" rx="13" ry="16" stroke="url(#cyanGrad)" stroke-width="2.6" fill="#081c33" fill-opacity="0.8"/>
    
    <!-- String Grid -->
    <line x1="26" y1="5" x2="26" y2="31" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="29" y1="3" x2="29" y2="33" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="32" y1="2.5" x2="32" y2="33.5" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="35" y1="3" x2="35" y2="33" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="38" y1="5" x2="38" y2="31" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    
    <line x1="23" y1="9" x2="41" y2="9" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="20" y1="13" x2="44" y2="13" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="19.5" y1="18" x2="44.5" y2="18" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="20" y1="23" x2="44" y2="23" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>
    <line x1="23" y1="27" x2="41" y2="27" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.85"/>

    <!-- T-Joint -->
    <path d="M30 33.5 L34 33.5 L33 37 L31 37 Z" fill="url(#cyanGrad)"/>

    <!-- Shaft -->
    <line x1="32" y1="37" x2="32" y2="50" stroke="url(#cyanGrad)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Grip / Handle -->
    <rect x="30" y="50" width="4" height="12" rx="1.5" fill="#f8fafc"/>
    <line x1="30" y1="53" x2="34" y2="53" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="30" y1="56" x2="34" y2="56" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="30" y1="59" x2="34" y2="59" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Handle cap -->
    <path d="M29.5 61.5 H34.5 V63 H29.5 Z" fill="url(#cyanGrad)"/>
  </g>

  <!-- Shuttlecock (Quả cầu lông) -->
  <g transform="translate(42, 9) scale(0.72) rotate(32)">
    <ellipse cx="10" cy="20" rx="3.5" ry="3.5" fill="#ffffff"/>
    <path d="M6.5 20 A3.5 3.5 0 0 0 13.5 20 Z" fill="#cbd5e1"/>
    <!-- Feathers -->
    <path d="M7 18 L2 4 L18 4 L13 18 Z" fill="url(#goldGrad)" fill-opacity="0.95" stroke="#fbbf24" stroke-width="0.8"/>
    <line x1="4" y1="9" x2="16" y2="9" stroke="#fef08a" stroke-width="0.8"/>
    <line x1="5.5" y1="13.5" x2="14.5" y2="13.5" stroke="#fef08a" stroke-width="0.8"/>
    <line x1="2" y1="4" x2="7" y2="18" stroke="#ffffff" stroke-width="0.6"/>
    <line x1="7.3" y1="4" x2="9" y2="18" stroke="#ffffff" stroke-width="0.6"/>
    <line x1="12.7" y1="4" x2="11" y2="18" stroke="#ffffff" stroke-width="0.6"/>
    <line x1="18" y1="4" x2="13" y2="18" stroke="#ffffff" stroke-width="0.6"/>
  </g>
</svg>
